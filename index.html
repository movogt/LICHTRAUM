<header class="topbar">
  <a href="/" class="brand">lichtraum zürich</a>

  <nav aria-label="Main navigation">
    <button>Walks</button>
    <button>Light atlas</button>
    <button>Correspondence</button>
  </nav>

  <button class="primary">Add a photograph</button>
</header>

<main class="workspace">
  <aside class="sidebar">
    <section class="walk-journal">
      <h1>Reflective walks.</h1>
      <h2>Station to water.</h2>

      <p>
        A walk for two, from the station to the lake.
        Looking for light in windows, water and
        passing reflections.
      </p>

      <div class="walk-stats">
        <div><strong>2.0</strong><span>km</span></div>
        <div><strong>27</strong><span>minutes</span></div>
        <div><strong>4</strong><span>stops</span></div>
      </div>

      <button class="primary">Replay example</button>

      <label>
        Example walk progress
        <input type="range" min="0" max="100" value="0">
      </label>
    </section>
  </aside>

  <section class="map-panel" aria-label="Photo map">
    <div class="map-canvas"
         aria-label="Interactive map of Zürich"></div>
  </section>
</main>
